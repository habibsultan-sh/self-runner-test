name: Portfolio Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: habib-runner

    steps:
      - uses: actions/checkout@v4

      - name: Copy Files
        run: |
          sudo rsync -av --delete \
          --exclude=".git" \
          --exclude=".github" \
          $GITHUB_WORKSPACE/ \
          /var/www/html/

      - name: Restart Apache
        run: |
          sudo systemctl restart apache2
